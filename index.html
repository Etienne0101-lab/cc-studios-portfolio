<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC Studios — Visual Design Portfolio</title>
<meta name="description" content="CC Studios — a visual design portfolio spanning digital painting, brand concepts and photography.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="kicker">Visual Design Portfolio</p>
    <h1>CC Studios</h1>
    <p class="lede">A working collection of portraits, abstracts, brand concepts and photography — digital artwork and straight-from-the-camera moments, curated from years of making.</p>
  </div>
</header>

<div class="dock-wrap">
  <div class="dock">
    <div class="view-toggle" role="group" aria-label="Layout">
      <button type="button" data-view="overview" aria-pressed="true">Overview</button>
      <button type="button" data-view="editorial" aria-pressed="false">Editorial</button>
    </div>
    <nav class="filters" id="filters" aria-label="Filter by collection"></nav>
  </div>
</div>

<main>
  <section class="gallery" id="gallery" aria-live="polite"></section>
</main>

<footer>
  <p><strong>CC Studios</strong> · Visual Design Portfolio</p>
  <p class="fine">All artwork © CC Studios.</p>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close viewer">×</button>
  <button class="lb-prev" id="lbPrev" aria-label="Previous artwork">‹</button>
  <figure>
    <img id="lbImg" alt="">
    <figcaption>
      <h3 id="lbTitle"></h3>
      <p id="lbMeta"></p>
      <button class="lb-desc-toggle" id="lbDescToggle" aria-expanded="false" aria-controls="lbDesc">About this piece</button>
      <div class="lb-desc" id="lbDesc" hidden>
        <p id="lbDescText"></p>
      </div>
    </figcaption>
  </figure>
  <button class="lb-next" id="lbNext" aria-label="Next artwork">›</button>
</div>

<script src="works.js"></script>
<script src="app.js"></script>
</body>
</html>
